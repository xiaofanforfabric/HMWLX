# CNB 云原生构建配置
#
# 规则：
#   - 任意分支 push / PR 都跑全部测试
#   - 提交信息以 rel: / beta: / RC: / dev: 开头时，额外跑 build
#
# JDK：headlessmc 3.0.0-RC10-cn.* 的 class 文件要求 JVM 25+，
#      因此统一使用带 JDK 25 的镜像。
#
# LANG：必须显式给 UTF-8。镜像里 LANG 为空时，JDK 的文件名编码退回 ASCII
#      （-Dsun.jnu.encoding 在 JDK 18+ 已无法覆盖），而测试方法名是中文，
#      生成 HTML 报告时会抛 "Malformed input or input contains unmappable characters"，
#      测试全绿却让整个 Stage 失败。
#
# ${CNB_COMMIT_MESSAGE_TITLE} 是提交信息首行，
# 用 grep -qiE '^(rel|beta|RC|dev|test):' 判断是否为发布意图提交。
#
# 系统库：Compose Desktop 的渲染后端 Skiko 在类加载时 dlopen 自己的
#      native 库，而 libskiko-linux-x64.so 的动态依赖里有 libGL.so.1。
#      eclipse-temurin 基础镜像只带 JDK，没有 Mesa / X11 这类图形库，
#      于是所有碰到 Skia 的测试（头像编解码、内置皮肤）直接
#      UnsatisfiedLinkError: libGL.so.1: cannot open shared object file。
#      这些库必须在【宿主】装：CNB 的 docker 构建里 ./gradlew 跑在宿主机上。

# 兜底：所有分支
"**":
  push:
    - name: ci
      docker:
        image: eclipse-temurin:25-jdk
        # 中文测试名 -> 中文报告文件名，文件名编码必须是 UTF-8
        env:
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
        volumes:
          # Gradle 缓存跨构建复用，避免每次重下依赖
          - main:/root/.gradle:copy-on-write
      stages:
        # Eclipse Temurin 镜像不含图形库，先补齐 Skiko 依赖的系统库。
        # 这属于环境准备而非测试，失败原因和补测试代码完全不同，单独一个 stage 更好定位。
        - name: setup-graphics-libs
          script: |
            set -e
            # 有 apt 就用 apt，中系发行版没配源时退回 dnf/yum。
            if command -v apt-get >/dev/null 2>&1; then
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                libgl1 libglx-mesa0 libgl1-mesa-dri libglu1-mesa \
                libx11-6 libxi6 libxrender1 libxtst6 libxext6 libxrandr2 \
                fontconfig fonts-dejavu-core
            elif command -v dnf >/dev/null 2>&1; then
              dnf install -y mesa-libGL mesa-libGLU libX11 libXi libXrender \
                libXtst libXext libXrandr fontconfig dejavu-sans-fonts
            elif command -v yum >/dev/null 2>&1; then
              yum install -y mesa-libGL mesa-libGLU libX11 libXi libXrender \
                libXtst libXext libXrandr fontconfig dejavu-sans-fonts
            else
              echo "没有可用的包管理器，Skiko 所需的 libGL 装不上" >&2
              exit 1
            fi
            # 装完先确认链接器能找到，省得后面测试里变成难读的 UnsatisfiedLinkError。
            ldconfig
            ls -l /usr/lib/x86_64-linux-gnu/libGL.so.1 || ldconfig -p | grep -m1 libGL

        - name: run-tests
          script: |
            chmod +x ./gradlew
            # --no-build-cache：quarkusGenerateCode 不把 application.properties 当输入，
            # 改 index-dependency / hmc.auth.yggdrasil.url 后缓存键不变，
            # 会恢复出旧配置的 bean 索引。
            ./gradlew test --no-daemon --no-build-cache --stacktrace

        # 仅 release-intent 提交才构建
        - name: build
          if: |
            printf '%s' "$CNB_COMMIT_MESSAGE_TITLE" | grep -qiE '^(rel|beta|RC|dev|test):'
          script: |
            chmod +x ./gradlew
            ./gradlew build --no-daemon --no-build-cache --stacktrace

        - name: show-artifacts
          if: |
            printf '%s' "$CNB_COMMIT_MESSAGE_TITLE" | grep -qiE '^(rel|beta|RC|dev|test):'
          script: |
            echo "=== build/libs ==="
            ls -la build/libs/ 2>/dev/null || true
            echo "=== build/quarkus-app ==="
            ls -la build/quarkus-app/ 2>/dev/null || true

        # ------------------------------------------------------------------
        # 发版打包
        #
        # 触发条件与 GitHub Actions 保持一致：提交信息首行以
        # rel: / RC: / beta: / dev: 开头。
        #
        # 与 GitHub 的分工：
        #   GitHub  自动开 PR 推进版本号 -> 合并后打 tag -> 构建并发布
        #   CNB     同样的提交进来时，也跑一遍构建，产物传到 CNB 制品库
        #
        # 两边都构建是有意为之：产物清单、文件大小可以互相验证，
        # 也避免单点故障（一个平台挂了另一个还能发）。
        # ------------------------------------------------------------------
        - name: release-build
          if: |
            printf '%s' "$CNB_COMMIT_MESSAGE_TITLE" | grep -qiE '^(rel|beta|RC|dev|test):'
          script: |
            set -euo pipefail
            echo "发版/演练提交：$CNB_COMMIT_MESSAGE_TITLE"

            # 版本号与阶段解析（与 GitHub 用同一套脚本，保证行为一致）。
            #
            # test: 前缀时 release.sh 只输出提示、不改 gradle.properties，
            # 后面照常打包 —— 这就是「演练」：产物能出，但版本号不动、
            # 不发版。用空提交即可触发：
            #   git commit --allow-empty -m "test: 验证打包"
            ./scripts/release.sh --prepare "$CNB_COMMIT_MESSAGE_TITLE"

            # --- 依赖 ---
            #
            # 每个 stage 可能是独立容器，不共享前一个 stage 装的东西，
            # 所以这里要把打包需要的一次性装齐：
            #
            #   zip unzip   打压缩包
            #   rpm         rpmbuild 打 RPM 包
            #   xz-utils    解压 zig 的 tar.xz
            #   file        校验产物类型
            #   curl        下载 zig
            #
            # 图形库（libgl1 等）也要装：pack-*.sh 本身不需要，但
            # build.sh 里的 quarkusBuild 会加载应用类，某些类加载
            # 路径会触发 Skiko 的 native 初始化。前一个 stage 装过，
            # 但 stage 之间不共享文件系统。
            if command -v apt-get >/dev/null 2>&1; then
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                zip unzip rpm xz-utils file curl \
                libgl1 libglx-mesa0 libgl1-mesa-dri libglu1-mesa \
                libx11-6 libxi6 libxrender1 libxtst6 libxext6 libxrandr2 \
                fontconfig fonts-dejavu-core
              ldconfig || true
            elif command -v dnf >/dev/null 2>&1; then
              dnf install -y zip unzip rpm-build xz file curl \
                mesa-libGL mesa-libGLU libX11 libXi libXrender \
                libXtst libXext libXrandr fontconfig dejavu-sans-fonts
            elif command -v yum >/dev/null 2>&1; then
              yum install -y zip unzip rpm-build xz file curl \
                mesa-libGL mesa-libGLU libX11 libXi libXrender \
                libXtst libXext libXrandr fontconfig dejavu-sans-fonts
            fi

            chmod +x ./gradlew scripts/*.sh scripts/*.py

            # zig：官方 tarball，0.13.0 是本地验证过的版本。
            #
            # zig 解开是 16000+ 个小文件，CNB 上好几个位置都撑不住这种
            # 批量创建：$HOME、/tmp 是 overlay 挂载，随机报
            # "Function not implemented"（ENOSYS）并卡 3 分钟才失败；
            # 工作区 /workspace 也不行 —— 它是专门优化「海量小文件 commit」
            # 的存储，tar 展开 lib/std 时照样 ENOSYS。
            #
            # 所以这里显式指定 /usr/local/zig：容器层是可写 overlayfs，
            # 走的是本地盘，13000+ 小文件写进去没问题。显式指定同时也
            # 表示「构建机可丢弃」，不必追求跨构建复用。
            #
            # 不设 HMWLX_ZIG_DIR 时，install-zig.sh 会自动逐个候选位置
            # 重试解压，适合本地开发。
            export HMWLX_ZIG_DIR=/usr/local/zig

            # 镜像：CNB 节点直连 ziglang.org 实测 ~5MB/s，44MB 约 9 秒，
            # 够用。华为云是官方 tarball 的镜像副本，脚本按顺序试、
            # 校验大小之后才用，down 不下来就自动退回官方。
            #
            # 别用 npmmirror 的 /mirrors/zig：它 302 到
            # cdn.npmmirror.com/binaries/zig/… 后是 NoSuchKey 404，
            # 只会让每次构建先吃一个必然失败的请求。
            export HMWLX_ZIG_MIRROR=https://mirrors.huaweicloud.com/zig

            ZIG_DIR="$(./scripts/install-zig.sh --path)"
            export PATH="$ZIG_DIR:$PATH"
            echo "zig: $(zig version)"

            # 构建 fat jar（build.sh 会挑 JDK 25）
            ./scripts/build.sh --fast

            # 三步打包，顺序不能变：formats 依赖 pack-linux.sh 的目录产物
            ./scripts/pack-windows.sh
            ./scripts/pack-linux.sh
            ./scripts/pack-linux-formats.sh

            echo "=== 产物 ==="
            ls -lh dist/

        - name: release-upload
          if: |
            printf '%s' "$CNB_COMMIT_MESSAGE_TITLE" | grep -qiE '^(rel|beta|RC|dev|test):'
          script: |
            set -euo pipefail
            # 列出产物供 CNB 制品库收集。
            # .cnb.yml 里不需要显式声明制品路径 —— CNB 会收集
            # 构建结束时 dist/ 下的文件，在「制品」页可下载。
            echo "=== 发版产物 ==="
            for f in dist/*.exe dist/*.run dist/*.deb dist/*.rpm dist/*.AppImage dist/*.tar.gz; do
              [ -f "$f" ] && echo "$(du -h "$f" | cut -f1)  $f"
            done
            echo ""
            VERSION=$(sed -n 's/^appVersion[[:space:]]*=[[:space:]]*//p' gradle.properties | head -1 | xargs)
            echo "版本: $VERSION"

  pull_request:
    - name: pr-check
      docker:
        image: eclipse-temurin:25-jdk
        # 中文测试名 -> 中文报告文件名，文件名编码必须是 UTF-8
        env:
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
        volumes:
          # PR 场景缓存只读，避免并发写入冲突
          - main:/root/.gradle:copy-on-write-read-only
      stages:
        # 与 push 分支相同，见上方 setup-graphics-libs 的说明。
        - name: setup-graphics-libs
          script: |
            set -e
            if command -v apt-get >/dev/null 2>&1; then
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                libgl1 libglx-mesa0 libgl1-mesa-dri libglu1-mesa \
                libx11-6 libxi6 libxrender1 libxtst6 libxext6 libxrandr2 \
                fontconfig fonts-dejavu-core
            elif command -v dnf >/dev/null 2>&1; then
              dnf install -y mesa-libGL mesa-libGLU libX11 libXi libXrender \
                libXtst libXext libXrandr fontconfig dejavu-sans-fonts
            elif command -v yum >/dev/null 2>&1; then
              yum install -y mesa-libGL mesa-libGLU libX11 libXi libXrender \
                libXtst libXext libXrandr fontconfig dejavu-sans-fonts
            else
              echo "没有可用的包管理器，Skiko 所需的 libGL 装不上" >&2
              exit 1
            fi
            ldconfig
            ls -l /usr/lib/x86_64-linux-gnu/libGL.so.1 || ldconfig -p | grep -m1 libGL

        - name: run-tests
          script: |
            chmod +x ./gradlew
            # --no-build-cache 的理由同 push 分支，见上方注释。
            ./gradlew test --no-daemon --no-build-cache --stacktrace
