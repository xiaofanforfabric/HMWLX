# CNB 云原生构建配置
#
# 规则：
#   - 任意分支 push / PR 都跑全部测试
#   - 提交信息以 rel: / beta: / RC: / dev: 开头时，额外跑 build
#
# JDK：headlessmc 3.0.0-RC10-cn.* 的 class 文件要求 JVM 25+，
#      因此统一使用带 JDK 25 的镜像。
#
# LANG：必须显式给 UTF-8。镜像里 LANG 为空时，JDK 的文件名编码退回 ASCII
#      （-Dsun.jnu.encoding 在 JDK 18+ 已无法覆盖），而测试方法名是中文，
#      生成 HTML 报告时会抛 "Malformed input or input contains unmappable characters"，
#      测试全绿却让整个 Stage 失败。
#
# ${CNB_COMMIT_MESSAGE_TITLE} 是提交信息首行，
# 用 grep -qiE '^(rel|beta|RC|dev|test):' 判断是否为发布意图提交。
#
# 系统库：Compose Desktop 的渲染后端 Skiko 在类加载时 dlopen 自己的
#      native 库，而 libskiko-linux-x64.so 的动态依赖里有 libGL.so.1。
#      eclipse-temurin 基础镜像只带 JDK，没有 Mesa / X11 这类图形库，
#      于是所有碰到 Skia 的测试（头像编解码、内置皮肤）直接
#      UnsatisfiedLinkError: libGL.so.1: cannot open shared object file。
#      这些库必须在【宿主】装：CNB 的 docker 构建里 ./gradlew 跑在宿主机上。

# 兜底：所有分支
"**":
  push:
    - name: ci
      docker:
        # 打包环境镜像：JDK 25 + zig 0.13 + rpm/zip 等工具。
        # 见 docker/build-env.Dockerfile。
        #
        # 为什么用 docker.build 而不是现成镜像：zig 的 tarball 解开是
        # 16000+ 个小文件，CNB 构建机的存储扛不住这种一次性大量写入
        # （报 ENOSYS）。而 docker build 的层是普通 overlayfs，
        # 解压毫无压力；且 CNB 按 Dockerfile 内容哈希缓存镜像，
        # 构建一次之后每次 CI 直接命中，连下载都省了。
        #
        # 建镜像时改了 Dockerfile 才会重建，改业务代码不受影响。
        build: docker/build-env.Dockerfile
        # 中文测试名 -> 中文报告文件名，文件名编码必须是 UTF-8
        env:
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
        volumes:
          # Gradle 缓存跨构建复用，避免每次重下依赖
          - main:/root/.gradle:copy-on-write
      stages:
        # 图形库（libGL / X11 / 字体）已经在 docker/build-env.Dockerfile 里
        # 装好了，这里不再单独补 —— 每个 stage 用的是同一个镜像，
        # 镜像里有什么这里就有什么。反复 apt update 只会拖慢构建，
        # 而且 apt 源不通时还会让整条流水线失败。

        - name: run-tests
          script: |
            chmod +x ./gradlew
            # --no-build-cache：quarkusGenerateCode 不把 application.properties 当输入，
            # 改 index-dependency / hmc.auth.yggdrasil.url 后缓存键不变，
            # 会恢复出旧配置的 bean 索引。
            ./gradlew test --no-daemon --no-build-cache --stacktrace

        # 仅 release-intent 提交才构建
        - name: build
          if: |
            printf '%s' "$CNB_COMMIT_MESSAGE_TITLE" | grep -qiE '^(rel|beta|RC|dev|test):'
          script: |
            chmod +x ./gradlew
            ./gradlew build --no-daemon --no-build-cache --stacktrace

        - name: show-artifacts
          if: |
            printf '%s' "$CNB_COMMIT_MESSAGE_TITLE" | grep -qiE '^(rel|beta|RC|dev|test):'
          script: |
            echo "=== build/libs ==="
            ls -la build/libs/ 2>/dev/null || true
            echo "=== build/quarkus-app ==="
            ls -la build/quarkus-app/ 2>/dev/null || true

        # ------------------------------------------------------------------
        # 发版打包
        #
        # 触发条件与 GitHub Actions 保持一致：提交信息首行以
        # rel: / RC: / beta: / dev: 开头。
        #
        # 与 GitHub 的分工：
        #   GitHub  自动开 PR 推进版本号 -> 合并后打 tag -> 构建并发布
        #   CNB     同样的提交进来时，也跑一遍构建，产物传到 CNB 制品库
        #
        # 两边都构建是有意为之：产物清单、文件大小可以互相验证，
        # 也避免单点故障（一个平台挂了另一个还能发）。
        # ------------------------------------------------------------------
        - name: release-build
          if: |
            printf '%s' "$CNB_COMMIT_MESSAGE_TITLE" | grep -qiE '^(rel|beta|RC|dev|test):'
          script: |
            set -euo pipefail
            echo "发版/演练提交：$CNB_COMMIT_MESSAGE_TITLE"

            # 版本号与阶段解析（与 GitHub 用同一套脚本，保证行为一致）。
            #
            # test: 前缀时 release.sh 只输出提示、不改 gradle.properties，
            # 后面照常打包 —— 这就是「演练」：产物能出，但版本号不动、
            # 不发版。用空提交即可触发：
            #   git commit --allow-empty -m "test: 验证打包"
            ./scripts/release.sh --prepare "$CNB_COMMIT_MESSAGE_TITLE"

            # --- 依赖 ---
            #
            # zip / rpm / xz / file 和图形库全都装在镜像里了
            # （docker/build-env.Dockerfile），这里不再 apt install：
            #   - 每个 stage 是独立容器，但用的是同一个镜像，
            #     镜像里有什么这里就有什么；
            #   - 重复 apt update 每次要几秒到几十秒，而且 apt 源被墙时
            #     还会让整个打包失败 —— 明明镜像里已经装好了。
            #
            # 这里只做存在性检查：缺东西就立刻报错，别拖到打包第 3 步
            # 才发现没有 rpmbuild。
            for cmd in zip unzip rpmbuild xz file jlink python3; do
              command -v "$cmd" >/dev/null 2>&1 || {
                echo "错误：镜像里缺少 $cmd，请检查 docker/build-env.Dockerfile" >&2
                exit 1
              }
            done

            chmod +x ./gradlew scripts/*.sh scripts/*.py

            # 启动器编译器：Windows 用 mingw-w64，Linux 用 gcc，
            # 两者都在镜像里（见 docker/build-env.Dockerfile）。
            # 不再需要 zig，也就不再有「下载并解压 16000 个小文件」那一步。
            for cc in x86_64-w64-mingw32-gcc gcc; do
              command -v "$cc" >/dev/null 2>&1 || {
                echo "错误：镜像里缺少 $cc，请检查 docker/build-env.Dockerfile" >&2
                exit 1
              }
            done
            echo "Windows 编译器: $(x86_64-w64-mingw32-gcc --version | head -1)"
            echo "Linux 编译器:   $(gcc --version | head -1)"

            # 构建 fat jar（build.sh 会挑 JDK 25）
            ./scripts/build.sh --fast

            # 三步打包，顺序不能变：formats 依赖 pack-linux.sh 的目录产物
            ./scripts/pack-windows.sh
            ./scripts/pack-linux.sh
            ./scripts/pack-linux-formats.sh

            echo "=== 产物 ==="
            ls -lh dist/

        - name: release-upload
          if: |
            printf '%s' "$CNB_COMMIT_MESSAGE_TITLE" | grep -qiE '^(rel|beta|RC|dev|test):'
          script: |
            set -euo pipefail
            # 列出产物供 CNB 制品库收集。
            # .cnb.yml 里不需要显式声明制品路径 —— CNB 会收集
            # 构建结束时 dist/ 下的文件，在「制品」页可下载。
            echo "=== 发版产物 ==="
            for f in dist/*.exe dist/*.run dist/*.deb dist/*.rpm dist/*.AppImage dist/*.tar.gz; do
              [ -f "$f" ] && echo "$(du -h "$f" | cut -f1)  $f"
            done
            echo ""
            VERSION=$(sed -n 's/^appVersion[[:space:]]*=[[:space:]]*//p' gradle.properties | head -1 | xargs)
            echo "版本: $VERSION"

  pull_request:
    - name: pr-check
      docker:
        # 与 push 用同一个打包环境镜像（JDK 25 + zig + 图形库 + rpm）。
        # 同一个 Dockerfile 哈希 → 同一个缓存镜像，不会重复构建。
        build: docker/build-env.Dockerfile
        # 中文测试名 -> 中文报告文件名，文件名编码必须是 UTF-8
        env:
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
        volumes:
          # PR 场景缓存只读，避免并发写入冲突
          - main:/root/.gradle:copy-on-write-read-only
      stages:
        # 图形库已装进镜像，不需要单独补 stage（同 push 分支）。

        - name: run-tests
          script: |
            chmod +x ./gradlew
            # --no-build-cache 的理由同 push 分支，见上方注释。
            ./gradlew test --no-daemon --no-build-cache --stacktrace
