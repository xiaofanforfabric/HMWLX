# CNB 云原生构建配置
#
# 规则：
#   - 任意分支 push / PR 都跑全部测试
#   - 提交信息以 rel: / beta: / RC: / dev: 开头时，额外跑 build
#
# JDK：headlessmc 3.0.0-RC10-cn.* 的 class 文件要求 JVM 25+，
#      因此统一使用带 JDK 25 的镜像。
#
# LANG：必须显式给 UTF-8。镜像里 LANG 为空时，JDK 的文件名编码退回 ASCII
#      （-Dsun.jnu.encoding 在 JDK 18+ 已无法覆盖），而测试方法名是中文，
#      生成 HTML 报告时会抛 "Malformed input or input contains unmappable characters"，
#      测试全绿却让整个 Stage 失败。
#
# ${CNB_COMMIT_MESSAGE_TITLE} 是提交信息首行，
# 用 grep -qiE '^(rel|beta|RC|dev|test):' 判断是否为发布意图提交。
#
# 系统库：Compose Desktop 的渲染后端 Skiko 在类加载时 dlopen 自己的
#      native 库，而 libskiko-linux-x64.so 的动态依赖里有 libGL.so.1。
#      eclipse-temurin 基础镜像只带 JDK，没有 Mesa / X11 这类图形库，
#      于是所有碰到 Skia 的测试（头像编解码、内置皮肤）直接
#      UnsatisfiedLinkError: libGL.so.1: cannot open shared object file。
#      这些库必须在【宿主】装：CNB 的 docker 构建里 ./gradlew 跑在宿主机上。

# 兜底：所有分支
"**":
  push:
    - name: ci
      # 锁定 amd64 节点。
      #
      # 不写的话默认是 cnb:arch:default —— 文档没说明它到底是哪个架构。
      # 而打包链路里有多处 amd64 假设：
      #   - DEB 的 Architecture 字段硬编码 amd64
      #   - AppImage / .run 产物名带 x86_64
      #   - mingw 交叉编译虽然跨架构可行，但产物签名/校验按 x86_64 走
      # 一旦被调度到 arm64 节点，会打出架构标错的包 —— 那种包能看到
      # 却能装不上，比直接失败更糟。
      #
      # 明确写 amd64 还有一个好处：节点的 CPU 上限（1~64）比 arm64
      # （1~16）高，打包这种 IO 密集任务更合适。
      runner:
        tags: cnb:arch:amd64
      docker:
        # 打包环境镜像：JDK 25 + mingw-w64 + gcc + rpm/zip/python3。
        # 见 docker/build-env.Dockerfile。
        #
        # 为什么用 docker.build 而不是现成镜像：
        #   基础镜像（eclipse-temurin:25-jdk）不带 mingw-w64、rpm、zip 等，
        #   每次 stage 里 apt install 要几十秒且受 apt 源影响。
        #   焊进镜像后 CNB 按 Dockerfile 内容哈希缓存，构建一次就永久命中。
        #
        # 为什么不用 zig 交叉编译：
        #   zig 发行包解出来 16000+ 个小文件，而 CNB 的 /workspace 在
        #   OverlayFS 上，对这种批量写入会报 ENOSYS。换目录、换镜像源、
        #   稀疏解压、分段写、docker build 全试过，无效。
        #   反证：同一环境里 apt install（dpkg 路径）装 160 个包毫无问题。
        #   sfx.c 只是普通 C，mingw/gcc 编出来的产物完全等价。
        build: docker/build-env.Dockerfile
        # 中文测试名 -> 中文报告文件名，文件名编码必须是 UTF-8
        env:
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
          # 所有编译 / 中间产物都写到这里，见下方 volumes 的说明。
          # 脚本里统一用 ${BUILD_ROOT:?}，缺了直接报错，不静默回退。
          BUILD_ROOT: /build
        volumes:
          # Gradle 缓存跨构建复用，避免每次重下依赖
          - main:/root/.gradle:copy-on-write

          # ------------------------------------------------------------
          # 编译工作区（data 卷 = 临时数据卷，节点本地盘，结束自动清理）
          #
          # 为什么不能直接用 /workspace：
          #   /workspace 在这个平台上落在 OverlayFS 上（文档「流水线缓存」
          #   一节提到 copy-on-write 就基于 OverlayFS）。对这种下层目录做
          #   批量 stat / 创建会返回 ENOSYS：
          #     tar: ./opt/hmwlx/runtime/lib/server/libjvm.so:
          #          Cannot stat: Function not implemented
          #   之前四次踩坑（zig 解压、zip 更新大 jar、skiko 嵌入、
          #   dpkg-deb 打包）根因全是这一个。
          #
          # 为什么选 data 而不是 copy-on-write：
          #   copy-on-write 是给「跨构建要复用的缓存」用的（如 ~/.gradle）。
          #   编译中间产物每次都是新的，不需要跨构建保留，用 data 更合适：
          #   结束时自动清理，不占节点缓存空间。
          #
          # 目录划分：
          #   /build/...   编译、暂存、打包，全在 data 卷里
          #   /workspace/dist/  最终产物，留在工作区才能被 CNB 收集
          # ------------------------------------------------------------
          - /build:data
      stages:
        # 图形库（libGL / X11 / 字体）已经在 docker/build-env.Dockerfile 里
        # 装好了，这里不再单独补 —— 每个 stage 用的是同一个镜像，
        # 镜像里有什么这里就有什么。反复 apt update 只会拖慢构建，
        # 而且 apt 源不通时还会让整条流水线失败。

        - name: run-tests
          script: |
            chmod +x ./gradlew
            # --no-build-cache：quarkusGenerateCode 不把 application.properties 当输入，
            # 改 index-dependency / hmc.auth.yggdrasil.url 后缓存键不变，
            # 会恢复出旧配置的 bean 索引。
            ./gradlew test --no-daemon --no-build-cache --stacktrace

        # 仅 release-intent 提交才构建
        - name: build
          if: |
            printf '%s' "$CNB_COMMIT_MESSAGE_TITLE" | grep -qiE '^(rel|beta|RC|dev|test):'
          script: |
            chmod +x ./gradlew
            ./gradlew build --no-daemon --no-build-cache --stacktrace

        - name: show-artifacts
          if: |
            printf '%s' "$CNB_COMMIT_MESSAGE_TITLE" | grep -qiE '^(rel|beta|RC|dev|test):'
          script: |
            echo "=== build/libs ==="
            ls -la build/libs/ 2>/dev/null || true
            echo "=== build/quarkus-app ==="
            ls -la build/quarkus-app/ 2>/dev/null || true

        # ------------------------------------------------------------------
        # 发版打包
        #
        # 触发条件与 GitHub Actions 保持一致：提交信息首行以
        # rel: / RC: / beta: / dev: 开头。
        #
        # 与 GitHub 的分工：
        #   GitHub  自动开 PR 推进版本号 -> 合并后打 tag -> 构建并发布
        #   CNB     同样的提交进来时，也跑一遍构建，产物传到 CNB 制品库
        #
        # 两边都构建是有意为之：产物清单、文件大小可以互相验证，
        # 也避免单点故障（一个平台挂了另一个还能发）。
        # ------------------------------------------------------------------
        - name: release-build
          # 跑两种提交：
          #   1. 发版前缀的（dev:/rel:/RC:/beta:/test:）—— 推进版本号 + 开 PR，
          #      同时打一遍产物做演练
          #   2. 主分支的普通提交 —— 也就是 PR 合并后的那次 push。
          #      这次构建才是真正的「发版」：版本号已由 PR 带进来，
          #      release-tag stage 会给它打 tag，产物也要同步产出。
          #
          # 之前只匹配第 1 种，导致 PR 合并后只打了 tag 没有产物，
          # tag 指向的 commit 在制品库里查不到东西。
          #
          # release-prepare.sh 对非发版提交会自己跳过（VERSION_CHANGED
          # 不为 true 时直接 return），所以放宽条件是安全的。
          if: |
            printf '%s' "$CNB_COMMIT_MESSAGE_TITLE" | grep -qiE '^(rel|beta|RC|dev|test):' \
            || printf '%s' "$CNB_BRANCH" | grep -qx "${CNB_DEFAULT_BRANCH:-master}"
          script: |
            set -euo pipefail
            echo "发版/演练提交：$CNB_COMMIT_MESSAGE_TITLE"

            # 版本推进 + 开 PR 的完整逻辑在 scripts/release-prepare.sh。
            #
            # 为什么不内联在这里：CNB 的 script 以 sh 兼容方式执行，
            # `[[ ]]` 会报 `sh: N: [[: not found`，而且 dash 对未知
            # 命令返回 0，错误还会被吞掉，跑到后面才炸。改用独立
            # 文件 + 显式 bash 调用，不依赖平台默认 shell。
            bash ./scripts/release-prepare.sh "$CNB_COMMIT_MESSAGE_TITLE"

            # --- 依赖 ---
            #
            # zip / rpm / xz / file 和图形库全都装在镜像里了
            # （docker/build-env.Dockerfile），这里不再 apt install：
            #   - 每个 stage 是独立容器，但用的是同一个镜像，
            #     镜像里有什么这里就有什么；
            #   - 重复 apt update 每次要几秒到几十秒，而且 apt 源被墙时
            #     还会让整个打包失败 —— 明明镜像里已经装好了。
            #
            # 这里只做存在性检查：缺东西就立刻报错，别拖到打包第 3 步
            # 才发现没有 rpmbuild。
            for cmd in zip unzip rpmbuild xz file jlink python3; do
              command -v "$cmd" >/dev/null 2>&1 || {
                echo "错误：镜像里缺少 $cmd，请检查 docker/build-env.Dockerfile" >&2
                exit 1
              }
            done

            chmod +x ./gradlew scripts/*.sh scripts/*.py

            # 启动器编译器：Windows 用 mingw-w64，Linux 用 gcc，
            # 两者都在镜像里（见 docker/build-env.Dockerfile）。
            # 不再需要 zig，也就不再有「下载并解压 16000 个小文件」那一步。
            for cc in x86_64-w64-mingw32-gcc gcc; do
              command -v "$cc" >/dev/null 2>&1 || {
                echo "错误：镜像里缺少 $cc，请检查 docker/build-env.Dockerfile" >&2
                exit 1
              }
            done
            echo "Windows 编译器: $(x86_64-w64-mingw32-gcc --version | head -1)"
            echo "Linux 编译器:   $(gcc --version | head -1)"

            # 架构校验：产物里写死了 amd64 / x86_64（DEB 的 Architecture
            # 字段、AppImage 文件名）。万一 runner.tags 没生效、被调度到
            # arm64 节点，宁可这里直接失败，也别产出架构标错的包 ——
            # 那种包能下载能看，却装不上，排查成本高得多。
            host_arch="$(uname -m)"
            if [ "$host_arch" != "x86_64" ]; then
              echo "错误：需要 x86_64 构建节点，当前是 $host_arch" >&2
              echo "  产物架构写死为 amd64，跑在 $host_arch 上会打出错包。" >&2
              echo "  检查 .cnb.yml 的 runner.tags 是否为 cnb:arch:amd64。" >&2
              exit 1
            fi
            echo "构建节点架构: $host_arch ✓"

            # 构建 fat jar（build.sh 会挑 JDK 25）
            ./scripts/build.sh --fast

            # 三步打包，顺序不能变：formats 依赖 pack-linux.sh 的目录产物
            ./scripts/pack-windows.sh
            ./scripts/pack-linux.sh
            ./scripts/pack-linux-formats.sh

            # fat jar 在 build/libs/，之前从没拷进 dist/，
            # 所以发版产物里一直没有它。用户想「直接 java -jar 跑」
            # 就得有这个。
            #
            # 不用 source scripts/version.sh 取 $FAT_JAR ——
            # CNB 的 script 是 sh 兼容模式，没有 source 内建命令，
            # 会报 `sh: N: source: not found`（exit 127）。
            # 直接用 glob 找，版本号变了也不用改这里。
            FAT_JAR=""
            for f in build/libs/*-all.jar; do
              [ -f "$f" ] && FAT_JAR="$f"
            done
            if [ -z "$FAT_JAR" ]; then
              echo "错误：找不到 fat jar（build/libs/*-all.jar）" >&2
              ls -la build/libs/ 2>/dev/null >&2 || true
              exit 1
            fi
            mkdir -p dist
            cp "$FAT_JAR" dist/
            echo "已收集: dist/$(basename "$FAT_JAR")"

            echo "=== 产物 ==="
            ls -lh dist/

        # ------------------------------------------------------------------
        # 打 tag
        #
        # 原来设计上 tag 完全交给 GitHub 的 release-tag.yml，CNB 只构建。
        # 但 GitHub 那边 verify 的输出写进 $GITHUB_ENV，同 step 读不到，
        # 合并 PR 后一直没打出 tag。补上这一步，CNB 自己闭环发版。
        #
        # 幂等：远端已有同名 tag 就跳过，两个平台不会互相冲突。
        # 只在主分支跑（脚本内部判断），release/xx 分支不碰。
        # ------------------------------------------------------------------
        - name: release-tag
          # 只在「主分支的普通提交」上打 tag —— 也就是 PR 合并后的那次
          # push。发版前缀（dev:/rel: 等）的那次 push 版本号还没推进，
          # 打 tag 会拿到旧版本号；而且那种提交走的是开 PR 流程，
          # tag 要等合并之后才该出现。
          if: |
            printf '%s' "$CNB_BRANCH" | grep -qx "${CNB_DEFAULT_BRANCH:-master}" \
            && ! printf '%s' "$CNB_COMMIT_MESSAGE_TITLE" | grep -qiE '^(rel|beta|RC|dev|test):'
          script: |
            set -euo pipefail
            bash ./scripts/cnb-tag.sh

        - name: release-upload
          # 条件与 release-build 保持一致：主分支的普通提交（PR 合并后
          # 那次）也要把产物交到制品库，否则 tag 指向的 commit 在制品
          # 库里查不到东西。
          if: |
            printf '%s' "$CNB_COMMIT_MESSAGE_TITLE" | grep -qiE '^(rel|beta|RC|dev|test):' \
            || printf '%s' "$CNB_BRANCH" | grep -qx "${CNB_DEFAULT_BRANCH:-master}"
          script: |
            set -euo pipefail
            # 列出产物供 CNB 制品库收集。
            # .cnb.yml 里不需要显式声明制品路径 —— CNB 会收集
            # 构建结束时 dist/ 下的文件，在「制品」页可下载。
            echo "=== 发版产物 ==="
            for f in dist/*.exe dist/*.run dist/*.deb dist/*.rpm dist/*.AppImage dist/*.tar.gz dist/*-all.jar; do
              [ -f "$f" ] && echo "$(du -h "$f" | cut -f1)  $f"
            done
            echo ""
            VERSION=$(sed -n 's/^appVersion[[:space:]]*=[[:space:]]*//p' gradle.properties | head -1 | xargs)
            echo "版本: $VERSION"

  pull_request:
    - name: pr-check
      # 同 push：锁定 amd64，理由见上方 ci pipeline 的注释
      runner:
        tags: cnb:arch:amd64
      docker:
        # 与 push 用同一个打包环境镜像（JDK 25 + mingw-w64 + gcc + rpm）。
        # 同一个 Dockerfile 哈希 → 同一个缓存镜像，不会重复构建。
        build: docker/build-env.Dockerfile
        # 中文测试名 -> 中文报告文件名，文件名编码必须是 UTF-8
        env:
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
          BUILD_ROOT: /build
        volumes:
          # PR 场景缓存只读，避免并发写入冲突
          - main:/root/.gradle:copy-on-write-read-only
          # 同 push：编译工作区挂 data 卷，避开 /workspace 的 OverlayFS 限制
          - /build:data
      stages:
        # 图形库已装进镜像，不需要单独补 stage（同 push 分支）。

        - name: run-tests
          script: |
            chmod +x ./gradlew
            # --no-build-cache 的理由同 push 分支，见上方注释。
            ./gradlew test --no-daemon --no-build-cache --stacktrace
