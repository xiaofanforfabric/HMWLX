# Gradle 构建配置
#
# 这些参数在 CI 环境里尤其重要：Maven Central 对匿名请求有速率限制，
# 并发拉取依赖时容易收到 429 Too Many Requests。
# 加大超时并提高重试次数，可以让构建更稳。

# JVM 参数：Gradle 需要足够的内存处理 Quarkus + Compose 的依赖图
# file.encoding：源码、测试名都是中文，统一 UTF-8。
# 注意：中文**文件名**（测试报告）靠的是 LANG，见 .cnb.yml / ci.yml；
# -Dsun.jnu.encoding 在 JDK 18+ 已不能覆盖，写了也没用。
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# 构建性能
org.gradle.parallel=true

# 构建缓存：默认关闭。
#
# 原因：Quarkus 的 quarkusGenerateCode / quarkusGenerateCodeTests 两个任务
# **不把 application.properties 当成输入**。实测改完配置后 build cache key
# 完全不变（仍是 ace5933...），于是从缓存恢复出来的 bean 索引还是旧配置生成的。
#
# 具体后果：往 application.properties 里新增一条 quarkus.index-dependency.*
# 之后，本地因为直接执行过该任务而生效，CI 却从缓存拿到旧索引 ——
# 表现就是 headlessmc-auth-yggdrasil 的 YggdrasilAuthProvider 明明在 classpath 上，
# 却没有注册进 CDI，getProvider("yggdrasil") 返回空。（CI 上白查了四轮才定位到）
#
# 这个项目构建不算慢（增量 ~30s），不值得为这点时间冒产物与配置不一致的风险。
org.gradle.caching=false

# HTTP 超时与重试（应对镜像/中央仓库的瞬时错误与限流）
systemProp.org.gradle.internal.http.connectionTimeout=180000
systemProp.org.gradle.internal.http.socketTimeout=180000
systemProp.org.gradle.internal.repository.max.retries=10
systemProp.org.gradle.internal.repository.initial.backoff=2000
