// 仓库策略（2026-10 修订）
//
// 背景：CI 构建机的出网 IP 常被 Maven Central 限流，直接 mavenCentral() 会拿到
// 429 Too Many Requests，所以默认全走国内镜像，官方源只作最后兜底。
//
// 三条踩过的坑，决定了下面的顺序：
//
// 1. 插件 marker（io.quarkus.gradle.plugin 等）在 maven-public / aliyun / huaweicloud
//    上都是 404，只有腾讯云 gradle-plugins 和 plugins.gradle.org 有。
//
// 2. gradle-plugins 里只有插件坐标，没有插件自身的传递依赖
//    （quarkus-bootstrap-core、aesh 等在它里面 404）。Gradle 一旦为某个模块选定仓库，
//    就只会去那一个仓库找它的全部构件，所以两类坐标必须用 exclusiveContent 隔开。
//
// 3. 腾讯云 maven-public 不可靠：同一构件会间歇性返回 404（同一 URL 连查几次在
//    404/200 之间跳），拿到 404 后 Gradle 会禁用整个仓库并回落到 gradlePluginPortal
//    / mavenCentral，于是 429 又回来了。阿里云 / 华为云没有这个问题，
//    所以它们排在腾讯云前面。
pluginManagement {
    repositories {
        // 插件坐标专用空域
        exclusiveContent {
            forRepository {
                maven {
                    name = 'TencentCloudGradlePlugin'
                    url = 'https://mirrors.cloud.tencent.com/nexus/repository/gradle-plugins/'
                }
            }
            filter {
                includeModuleByRegex(".*", ".*\\.gradle\\.plugin")
            }
        }
        // 插件自身的依赖
        maven {
            name = 'Aliyun'
            url = 'https://maven.aliyun.com/repository/public/'
        }
        maven {
            name = 'HuaweiCloud'
            url = 'https://mirrors.huaweicloud.com/repository/maven/'
        }
        maven {
            name = 'TencentCloud'
            url = 'https://mirrors.cloud.tencent.com/nexus/repository/maven-public/'
        }
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositories {
        // 只存在于 JitPack 的构件（headlessmc 及其子模块）放最前，直接打真源，
        // 镜像上的 pom 会 404。
        maven {
            name = 'JitPack'
            url = 'https://jitpack.io'
        }
        maven {
            name = 'Aliyun'
            url = 'https://maven.aliyun.com/repository/public/'
        }
        maven {
            name = 'HuaweiCloud'
            url = 'https://mirrors.huaweicloud.com/repository/maven/'
        }
        maven {
            name = 'TencentCloud'
            url = 'https://mirrors.cloud.tencent.com/nexus/repository/maven-public/'
        }
        mavenCentral()
    }
}

rootProject.name = 'HMYLX'
