# --- 启动前的账号预检 ---
# 网络类文案只在微软账号上出现：只有它的令牌需要找微软续期。
auth.network.failed.title=无法连接{0}，账号令牌未能刷新
auth.network.failed.body=账号「{1}」的令牌这次没能刷新。可能是网络暂时波动，也可能是{0}宕机或限流。
auth.network.failed.hint=进入游戏后令牌可能是过期的，导致无法进入需要验证的服务器。单人游戏不受影响。请检查本地网络，或稍后重新启动以刷新令牌。
auth.network.launch.anyway=仍然启动
auth.network.cancel=取消
auth.rate.limited.body=账号「{1}」的令牌这次没能刷新：{0}正在限流（HTTP 429 Too Many Requests），请在约 {2} 后再试，期间不要反复点击启动。
auth.rate.limited.body.no.delay=账号「{1}」的令牌这次没能刷新：{0}正在限流（HTTP 429 Too Many Requests），请稍等几分钟再试，期间不要反复点击启动。
auth.credential.invalid.title=账号「{0}」的登录凭据已失效
auth.credential.invalid.hint=可能是登录过期、账号被封禁，或该账号没有游戏所有权（例如 Xbox Game Pass 已到期）。重试无法解决，需要重新登录。
auth.credential.relogin=重新登录
auth.session.expired.title=账号「{0}」的皮肤站登录已失效
auth.session.expired.hint=外置登录服务器拒绝了这个账号的令牌，登录可能失效，本次启动会按离线账号运行：单人游戏正常，但进入联机服务器时会被拒绝（invalid session）。需要重新登录才能恢复联机。
auth.session.expired.launch=继续启动（离线）
auth.no.account=还没有登录任何账号。请先在账号页面添加一个账号。
