# HMWLX 中文语言包。
#
# 只放界面文案。日志、异常信息、注释不在这里 —— 那些是给开发者看的，
# 翻译成中文/英文都不影响用户体验，挪进来反而每次查日志要对着 key 找。
#
# 占位符写法：{0}、{1}
# 漏了 key 时界面显示 !key!，能一眼看出来。

