# HMWLX 的 Quarkus 配置。
#
# 说明：headlessmc 本身是 Quarkus 应用，HMWLX 通过 Quarkus 插件做构建期增强，
# 以便在进程内启动它的 CDI 容器。这个文件是 Quarkus 项目的必需项。
#
# 不要在这里配置 HTTP / 端口 —— HMWLX 是纯桌面 GUI，
# 启动的 Quarkus 容器只用于提供 headlessmc 的 CDI bean，不监听任何端口。

# headlessmc 的资产下载配置（来自 headlessmc-application 的 application.properties）
hmc.assets.net.retries=0
hmc.assets.net.cookies=true

# === CDI bean 归档 ===
#
# 关键：Quarkus 默认只索引自己的项目字节码，不会去索引依赖 jar 里的 CDI bean。
# headlessmc 作为外部 jar 引入时，它的 @ApplicationScoped bean 不会参与
# 构建期增强，导致 ArC 为它们生成的代理类信息不完整
# （典型症状：_ClientProxy 里硬编码了不存在的无参构造器，运行期 NoSuchMethodError）。
#
# 用 quarkus.index-dependency 显式把这些 jar 纳入索引，就能让它们和 HMWLX
# 自己的 bean 一样被正确处理。
#
# groupId/artifactId 必须同时给，值对应 JitPack 坐标：
#   group: com.github.xiaofanforfabric.headlessmc
#   artifact: headlessmc-<module>
quarkus.index-dependency.headlessmc-files.group-id=com.github.xiaofanforfabric.headlessmc
quarkus.index-dependency.headlessmc-files.artifact-id=headlessmc-files
quarkus.index-dependency.headlessmc-config.group-id=com.github.xiaofanforfabric.headlessmc
quarkus.index-dependency.headlessmc-config.artifact-id=headlessmc-config
quarkus.index-dependency.headlessmc-application.group-id=com.github.xiaofanforfabric.headlessmc
quarkus.index-dependency.headlessmc-application.artifact-id=headlessmc-application
quarkus.index-dependency.headlessmc-commands.group-id=com.github.xiaofanforfabric.headlessmc
quarkus.index-dependency.headlessmc-commands.artifact-id=headlessmc-commands
quarkus.index-dependency.headlessmc-console.group-id=com.github.xiaofanforfabric.headlessmc
quarkus.index-dependency.headlessmc-console.artifact-id=headlessmc-console
quarkus.index-dependency.headlessmc-java.group-id=com.github.xiaofanforfabric.headlessmc
quarkus.index-dependency.headlessmc-java.artifact-id=headlessmc-java
quarkus.index-dependency.headlessmc-launcher.group-id=com.github.xiaofanforfabric.headlessmc
quarkus.index-dependency.headlessmc-launcher.artifact-id=headlessmc-launcher
quarkus.index-dependency.headlessmc-logging.group-id=com.github.xiaofanforfabric.headlessmc
quarkus.index-dependency.headlessmc-logging.artifact-id=headlessmc-logging
quarkus.index-dependency.headlessmc-mods.group-id=com.github.xiaofanforfabric.headlessmc
quarkus.index-dependency.headlessmc-mods.artifact-id=headlessmc-mods
quarkus.index-dependency.headlessmc-net.group-id=com.github.xiaofanforfabric.headlessmc
quarkus.index-dependency.headlessmc-net.artifact-id=headlessmc-net
quarkus.index-dependency.headlessmc-os.group-id=com.github.xiaofanforfabric.headlessmc
quarkus.index-dependency.headlessmc-os.artifact-id=headlessmc-os
quarkus.index-dependency.headlessmc-patcher.group-id=com.github.xiaofanforfabric.headlessmc
quarkus.index-dependency.headlessmc-patcher.artifact-id=headlessmc-patcher
quarkus.index-dependency.headlessmc-platform.group-id=com.github.xiaofanforfabric.headlessmc
quarkus.index-dependency.headlessmc-platform.artifact-id=headlessmc-platform
quarkus.index-dependency.headlessmc-auth.group-id=com.github.xiaofanforfabric.headlessmc
quarkus.index-dependency.headlessmc-auth.artifact-id=headlessmc-auth

# 认证体系的实际实现分散在这些 jar 里，必须一起索引：
#   auth-cdi      —— AuthFactory 的 @Produces 方法在这里，AuthStore / AuthProvider
#                    这些 bean 全靠它产出。漏了它 AuthService 拿到的 provider 是残缺的，
#                    表现为 getProvider(OFFLINE) 有值但取不到内部存储。
#   auth-offline  —— OfflineAuthProvider 与 OfflineAuthenticator
#   auth-yggdrasil—— YggdrasilAuthProvider，外置登录要用
#   auth-impl     —— McAuthProvider（微软正版），默认认证源
#   auth-store-gson —— 账号持久化（Gson 读写 JSON）
quarkus.index-dependency.headlessmc-auth-cdi.group-id=com.github.xiaofanforfabric.headlessmc
quarkus.index-dependency.headlessmc-auth-cdi.artifact-id=headlessmc-auth-cdi
quarkus.index-dependency.headlessmc-auth-offline.group-id=com.github.xiaofanforfabric.headlessmc
quarkus.index-dependency.headlessmc-auth-offline.artifact-id=headlessmc-auth-offline
quarkus.index-dependency.headlessmc-auth-yggdrasil.group-id=com.github.xiaofanforfabric.headlessmc
quarkus.index-dependency.headlessmc-auth-yggdrasil.artifact-id=headlessmc-auth-yggdrasil
quarkus.index-dependency.headlessmc-auth-impl.group-id=com.github.xiaofanforfabric.headlessmc
quarkus.index-dependency.headlessmc-auth-impl.artifact-id=headlessmc-auth-impl
quarkus.index-dependency.headlessmc-auth-store-gson.group-id=com.github.xiaofanforfabric.headlessmc
quarkus.index-dependency.headlessmc-auth-store-gson.artifact-id=headlessmc-auth-store-gson
